spring.application.name : worker-service
server:
  port: 8084

# Registers this service with discovery-service under the app name
# WORKER-SERVICE (derived from spring.application.name above) - matches
# CLAUDE.md's documented Eureka service list, which already named this
# service despite it never actually having registered until now.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  kafka:
    # SASL_SSL, principal "worker": Read on submission-topic (consumer group
    # worker-group), Write on execution-result-topic only (see infra/kafka/acls.sh)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    security:
      protocol: SASL_SSL
    properties:
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username="worker" password="${KAFKA_WORKER_PASSWORD:worker-dev-secret}";
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION:/certs/ca.crt}
      trust-store-type: PEM
    consumer:
      group-id: worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.MS_code_execution_platform.worker_service.dto.SubmissionEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

problem-service:
  url: http://localhost:8082

# Windows named pipe by default (this service's original, Windows-only local
# dev setup) - docker-compose.yml overrides this to the bind-mounted
# unix:///var/run/docker.sock, which is what actually exists inside this
# service's own (Linux) container. See DockerExecutionService.
docker:
  host: ${DOCKER_HOST:npipe:////./pipe/docker_engine}

# Service identity for calls to problem-service - this worker authenticates
# as itself via OAuth2 client-credentials (see client.AuthTokenClient), not
# with a user's token, since it has none to forward. Same client_id/secret
# worker-service-go uses - they're the same trust boundary.
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8086}

worker:
  client-id: ${WORKER_CLIENT_ID:worker-service}
  client-secret: ${WORKER_CLIENT_SECRET:dev-only-secret-change-me}
  # See DockerExecutionService and CodeExecutionService's comments.
  # scratch-dir: where submission source/input files are written - a plain
  # relative folder for local/non-Docker Windows dev, a shared named-volume
  # mount point (e.g. /scratch) in docker-compose.
  # scratch-volume: the Docker volume NAME to bind into sandbox containers.
  # Blank (default) means "not running against a shared volume" - use the
  # original per-submission host-path bind instead.
  scratch-dir: ${WORKER_SCRATCH_DIR:docker-code}
  scratch-volume: ${WORKER_SCRATCH_VOLUME:}

topics:
  submission: submission-topic
  execution-result: execution-result-topic
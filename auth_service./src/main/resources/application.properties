spring.application.name=auth-service

server.port=8086

# Refresh-token store
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

grpc.client.user-service.address=discovery:///USER-SERVICE
grpc.client.user-service.negotiationType=plaintext

# RS256 issuer identity - resource servers validate against these
jwt.issuer=https://auth-service
jwt.audience=ms-code-execution
jwt.key-id=auth-service-key-1
jwt.private-key-path=keys/jwt-private.pem
jwt.public-key-path=keys/jwt-public.pem
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=14

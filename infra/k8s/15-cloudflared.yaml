# Cloudflare Tunnel connector. Runs inside the cluster (not docker-compose)
# specifically so it can resolve and reach api-gateway over the cluster's
# own DNS (api-gateway.platform.svc.cluster.local) - the public hostname
# routing itself (api.nikhilsaravade.com -> that URL) is configured in the
# Cloudflare dashboard against this tunnel, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

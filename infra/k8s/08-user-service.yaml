apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: user-service
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/user-service:latest
          envFrom:
            - configMapRef:
                name: infra-endpoints
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-service:8086/.well-known/jwks.json"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://auth-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
              value: "ms-code-execution"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/user_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_DATASOURCE_USERNAME
              value: "user_service_app"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: DB_APP_PASSWORD
            - name: SPRING_FLYWAY_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/user_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_FLYWAY_USER
              value: "user_service_owner"
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: DB_OWNER_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: postgres-ca-cert
              mountPath: /certs/postgres-ca.crt
              subPath: postgres-ca.crt
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "320Mi"
            limits:
              cpu: "350m"
              memory: "400Mi"
      volumes:
        - name: postgres-ca-cert
          configMap:
            name: postgres-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: platform
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9090
      targetPort: 9090

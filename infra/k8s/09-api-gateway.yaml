# api-gateway is the single entry point the frontend/Cloudflare Tunnel will
# route to - see infra/k8s/README.md's "Exposing api-gateway" section for
# how it gets reached from outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api-gateway
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/api-gateway:latest
          envFrom:
            - configMapRef:
                name: infra-endpoints
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx400m"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-service:8086/.well-known/jwks.json"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://auth-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
              value: "ms-code-execution"
            # SecurityConfig's default (http://localhost:*) is dev-only -
            # the deployed frontend origin(s) need to be allowed explicitly,
            # or the browser rejects every request as a CORS failure before
            # it ever reaches this service.
            - name: CORS_ALLOWED_ORIGIN_PATTERNS
              value: "https://app.nikhilsaravade.com,https://*.nikhilsaravade.com,https://*.pages.dev"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "75m"
              memory: "450Mi"
            limits:
              cpu: "750m"
              memory: "600Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: platform
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080

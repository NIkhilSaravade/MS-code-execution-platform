apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-result-service
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-result-service
  template:
    metadata:
      labels:
        app: execution-result-service
    spec:
      # See 04-worker-deployment.yaml's hostAliases comment: Kafka advertises
      # itself as "kafka:9093" (docker-compose's KAFKA_ADVERTISED_LISTENERS),
      # which this Spring Kafka consumer also needs to resolve for its
      # consumer group coordinator connections - without this it fails with
      # UnknownHostException.
      hostAliases:
        - ip: "10.0.0.14"
          hostnames:
            - "kafka"
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: execution-result-service
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/execution-result-service:latest
          envFrom:
            - configMapRef:
                name: infra-endpoints
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-service:8086/.well-known/jwks.json"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://auth-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
              value: "ms-code-execution"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/execution_result_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_DATASOURCE_USERNAME
              value: "execution_result_service_app"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-result-service-secrets
                  key: DB_APP_PASSWORD
            - name: SPRING_FLYWAY_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/execution_result_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_FLYWAY_USER
              value: "execution_result_service_owner"
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-result-service-secrets
                  key: DB_OWNER_PASSWORD
            - name: KAFKA_EXECUTION_RESULT_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-result-service-secrets
                  key: KAFKA_PASSWORD
          volumeMounts:
            - name: postgres-ca-cert
              mountPath: /certs/postgres-ca.crt
              subPath: postgres-ca.crt
              readOnly: true
            - name: kafka-ca-cert
              mountPath: /certs/ca.crt
              subPath: ca.crt
              readOnly: true
          ports:
            - name: http
              containerPort: 8085
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "320Mi"
            limits:
              cpu: "400m"
              memory: "400Mi"
      volumes:
        - name: postgres-ca-cert
          configMap:
            name: postgres-ca-cert
        - name: kafka-ca-cert
          configMap:
            name: kafka-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: execution-result-service
  namespace: platform
spec:
  selector:
    app: execution-result-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085

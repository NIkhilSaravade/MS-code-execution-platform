apiVersion: apps/v1
kind: Deployment
metadata:
  name: problem-service
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: problem-service
  template:
    metadata:
      labels:
        app: problem-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: problem-service
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/problem-service:latest
          envFrom:
            - configMapRef:
                name: infra-endpoints
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-service:8086/.well-known/jwks.json"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://auth-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
              value: "ms-code-execution"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/problem_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_DATASOURCE_USERNAME
              value: "problem_service_app"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: problem-service-secrets
                  key: DB_APP_PASSWORD
            - name: SPRING_FLYWAY_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/problem_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_FLYWAY_USER
              value: "problem_service_owner"
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: problem-service-secrets
                  key: DB_OWNER_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: SECRET_KEY
          volumeMounts:
            - name: postgres-ca-cert
              mountPath: /certs/postgres-ca.crt
              subPath: postgres-ca.crt
              readOnly: true
          ports:
            - name: http
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "75m"
              memory: "450Mi"
            limits:
              cpu: "750m"
              memory: "576Mi"
      volumes:
        - name: postgres-ca-cert
          configMap:
            name: postgres-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: problem-service
  namespace: platform
spec:
  selector:
    app: problem-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082

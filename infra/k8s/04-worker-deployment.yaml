# worker-service-go's own Deployment. Runs in `platform` (NOT
# sandbox-execution - see 00-namespace.yaml), uses the ServiceAccount from
# 02-worker-rbac.yaml, and needs no /var/run/docker.sock mount at all anymore.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service-go
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service-go
  template:
    metadata:
      labels:
        app: worker-service-go
    spec:
      # Kafka's broker advertises itself to clients as "kafka:9093" (matches
      # docker-compose's KAFKA_ADVERTISED_LISTENERS, needed for kafka-ui/
      # acls.sh's own SASL admin client on that same docker network) - the
      # initial bootstrap via KAFKA_BROKERS (10.0.0.14, from this Deployment's
      # ConfigMap) succeeds, but kafka-go then needs to resolve that
      # advertised hostname itself to find the consumer group coordinator,
      # and "kafka" isn't a real DNS name inside this cluster. Mapping it to
      # the VM's IP here is the k8s-native fix, without touching the broker
      # config docker-compose's other siblings still rely on.
      hostAliases:
        - ip: "10.0.0.14"
          hostnames:
            - "kafka"
      serviceAccountName: worker-service-go
      # ghcr.io packages default to private, so pulling this image needs a
      # pull secret even though the cluster node has no other credentials -
      # see infra/k8s/README.md's "Container registry access" section for
      # how to create ghcr-pull-secret.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker-service-go
          # Built and pushed by .github/workflows/docker-build-push.yml.
          # :latest tracks main; pin to a :sha-<short-sha> or :vX.Y.Z tag
          # instead for anything beyond a dev cluster.
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/worker-service-go:latest
          envFrom:
            - configMapRef:
                name: worker-service-go-config
            - secretRef:
                name: worker-service-go-secrets
          env:
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: K8S_SANDBOX_NAMESPACE
              value: "sandbox-execution"
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /certs/ca.crt
              subPath: ca.crt
              readOnly: true
          ports:
            - name: health
              containerPort: 8091
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: kafka-ca-cert
          configMap:
            name: kafka-ca-cert

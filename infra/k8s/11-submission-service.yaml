apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
    spec:
      # See 04-worker-deployment.yaml's hostAliases comment: Kafka advertises
      # itself as "kafka:9093" (docker-compose's KAFKA_ADVERTISED_LISTENERS),
      # which this Spring Kafka client also needs to resolve for both
      # producer and consumer group coordinator connections - without this,
      # publishing SubmissionCreatedEvent fails with UnknownHostException
      # and eventually times out.
      hostAliases:
        - ip: "10.0.0.14"
          hostnames:
            - "kafka"
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: submission-service
          image: ghcr.io/nikhilsaravade/ms-code-execution-platform/submission-service:latest
          envFrom:
            - configMapRef:
                name: infra-endpoints
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-service:8086/.well-known/jwks.json"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://auth-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
              value: "ms-code-execution"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/submission_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_DATASOURCE_USERNAME
              value: "submission_service_app"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submission-service-secrets
                  key: DB_APP_PASSWORD
            - name: SPRING_FLYWAY_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/submission_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt"
            - name: SPRING_FLYWAY_USER
              value: "submission_service_owner"
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submission-service-secrets
                  key: DB_OWNER_PASSWORD
            - name: KAFKA_SUBMISSION_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submission-service-secrets
                  key: KAFKA_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: SECRET_KEY
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8086"
            - name: PROBLEM_SERVICE_URL
              value: "http://problem-service:8082"
            - name: SUBMISSION_SERVICE_CLIENT_ID
              value: "submission-service"
            - name: SUBMISSION_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: submission-service-secrets
                  key: CLIENT_SECRET
          volumeMounts:
            - name: postgres-ca-cert
              mountPath: /certs/postgres-ca.crt
              subPath: postgres-ca.crt
              readOnly: true
            - name: kafka-ca-cert
              mountPath: /certs/ca.crt
              subPath: ca.crt
              readOnly: true
          ports:
            - name: http
              containerPort: 8083
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "75m"
              memory: "450Mi"
            limits:
              cpu: "750m"
              memory: "576Mi"
      volumes:
        - name: postgres-ca-cert
          configMap:
            name: postgres-ca-cert
        - name: kafka-ca-cert
          configMap:
            name: kafka-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: platform
spec:
  selector:
    app: submission-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083

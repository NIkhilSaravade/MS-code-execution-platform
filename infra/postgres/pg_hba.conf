# TYPE   DATABASE  USER  ADDRESS  METHOD
#
# local (unix socket) stays trust - it's only reachable from inside this same
# container (used by the init scripts themselves), not over the network.
# Every network (TCP) connection MUST use TLS - there is no non-SSL "host"
# entry at all, so a plaintext connection attempt has no matching rule and is
# refused outright, not just discouraged.
local   all  all  trust
hostssl all  all  all  scram-sha-256

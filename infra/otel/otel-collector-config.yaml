# Minimal collector: receive OTLP from ai-analysis-service and
# worker-service-go, batch, forward to Jaeger's own OTLP receiver.
# Nothing here is exporting metrics/logs - traces only, matching what the
# two instrumented services actually emit today.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]

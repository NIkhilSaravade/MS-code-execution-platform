// SASL/PLAIN credentials for the broker and every client identity.
// Dev-only fixed credentials, same "floor" security posture already used
// elsewhere in this repo (e.g. WORKER_SERVICE_CLIENT_SECRET's default) -
// rotating these to come from Vault is Phase 4 follow-up work, deferred
// alongside the rest of that phase. Rotate all of these before any real
// deployment.
KafkaServer {
   org.apache.kafka.common.security.plain.PlainLoginModule required
   username="admin"
   password="admin-dev-secret"
   user_admin="admin-dev-secret"
   user_worker="worker-dev-secret"
   user_submission_service="submission-service-dev-secret"
   user_execution_result_service="execution-result-service-dev-secret"
   user_ai_analysis_service="ai-analysis-service-dev-secret";
};

// Credentials for Kafka's own connection to Zookeeper (SASL/DIGEST-MD5,
// matching the "Server" section in infra/kafka/zookeeper_jaas.conf). Needed
// both by the broker's real Zookeeper client and by the "cub zk-ready"
// preflight check the base image runs before starting - without a working
// Client section here, that check either fails outright or hangs (the mere
// presence of the java.security.auth.login.config system property, needed
// below for KafkaServer, makes the ZK client library assume SASL is
// required, so it has to actually succeed, not just be absent).
Client {
   org.apache.zookeeper.server.auth.DigestLoginModule required
   username="kafka"
   password="zk-dev-secret";
};

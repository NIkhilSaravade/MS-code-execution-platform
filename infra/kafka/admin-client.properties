# Used only to bootstrap topics/ACLs and for the broker healthcheck - the
# "admin" principal is a Kafka super user (see KAFKA_SUPER_USERS), bypassing
# ACL checks entirely, so no per-resource ACLs are granted for it separately.
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-dev-secret";
ssl.truststore.location=/certs/ca.crt
ssl.truststore.type=PEM

spring.application.name=submission-service
server.port=8083

# DATABASE - the running app connects with a DML-only role (no DDL rights,
# see infra/postgres/init-multiple-databases.sh) - Flyway alone gets the
# owner role, since it's the only thing here allowed to change schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/submission_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.datasource.username=submission_service_app
spring.datasource.password=submission-service-app-dev-secret

spring.flyway.url=jdbc:postgresql://localhost:5432/submission_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.flyway.user=submission_service_owner
spring.flyway.password=submission-service-owner-dev-secret
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# THE WORKER SWITCH (see SubmissionService.createSubmission's activeWorker
# field for how this is used). "java" -> worker-service (legacy), "go" ->
# worker-service-go. Change ACTIVE_WORKER in docker-compose.yml (or this
# default, for a non-Docker local run) and restart submission-service.
worker.active=${ACTIVE_WORKER:go}

# KAFKA - SASL_SSL, principal "submission_service": Write on submission-topic
# and submissions.created.v1, Read on submission-update-topic only (see infra/kafka/acls.sh)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="submission_service" password="${KAFKA_SUBMISSION_SERVICE_PASSWORD:submission-service-dev-secret}";
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:/certs/ca.crt}
spring.kafka.ssl.trust-store-type=PEM

# worker-service-go's submission topic - name deliberately matches its own
# KAFKA_TOPIC_SUBMISSIONS_CREATED default (internal/config/config.go)
kafka.topic.submissions-created=${KAFKA_TOPIC_SUBMISSIONS_CREATED:submissions.created.v1}

# S3-compatible storage (MinIO) for submitted code - env var names match
# problem-service's S3Config and worker-service-go's internal/config/config.go
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-east-1}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket-artifacts=${S3_BUCKET_ARTIFACTS:platform-artifacts}
s3.force-path-style=${S3_FORCE_PATH_STYLE:true}

# Resource server: verify tokens issued by auth-service (RS256, never trusts blindly)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-service
spring.security.oauth2.resourceserver.jwt.audiences=ms-code-execution

# Service identity for calls to problem-service (fetching a problem's
# generated harness before judging - see HarnessApplier) - this service
# authenticates as itself via OAuth2 client-credentials (see
# client.AuthTokenClient), same trust boundary worker-service/
# worker-service-go use for their own problem-service calls.
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8086}
problem-service.url=${PROBLEM_SERVICE_URL:http://localhost:8082}
submission-service.client-id=${SUBMISSION_SERVICE_CLIENT_ID:submission-service}
submission-service.client-secret=${SUBMISSION_SERVICE_CLIENT_SECRET:dev-only-secret-change-me}






spring.application.name=auth-service

server.port=8086

# Refresh-token store. The running app connects with a DML-only role (no DDL
# rights, see infra/postgres/init-multiple-databases.sh) - Flyway alone gets
# the owner role, since it's the only thing here allowed to change schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.datasource.username=auth_service_app
spring.datasource.password=auth-service-app-dev-secret
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.url=jdbc:postgresql://localhost:5432/auth_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.flyway.user=auth_service_owner
spring.flyway.password=auth-service-owner-dev-secret
spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

grpc.client.user-service.address=discovery:///USER-SERVICE
grpc.client.user-service.negotiationType=plaintext

# RS256 issuer identity - resource servers validate against these
jwt.issuer=https://auth-service
jwt.audience=ms-code-execution
jwt.key-id=auth-service-key-1
jwt.private-key-path=keys/jwt-private.pem
jwt.public-key-path=keys/jwt-public.pem
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=14

# Machine identities allowed to use the client-credentials grant (/auth/token).
# Config-based registry - fine for a handful of internal services; a real IdP
# would replace this if the number of service clients grows. Secret is env-var
# overridable so it never needs to be hardcoded outside local dev.
#
# worker-service-go authenticates to nothing anymore (submission-service embeds
# everything it needs into the Kafka event it consumes), so there is no
# worker-service client entry here - the legacy Java worker was the only
# consumer of one.

# submission-service calls problem-service (GET /problems/{id}) to fetch a
# problem's harness before publishing a submission - see SubmissionService's
# ProblemServiceClient.
service-clients.clients.submission-service.secret=${SUBMISSION_SERVICE_CLIENT_SECRET:dev-only-secret-change-me}
service-clients.clients.submission-service.role=SERVICE

# ai-analysis-service calls submission-service (GET /internal/submissions/{id})
# and problem-service (GET /problems/{id}) when triggered by the
# analysis.trigger.v1 Kafka event - it has no end-user token to forward in
# that path, unlike its existing POST /ai/analyze, which still uses the
# caller's own token.
service-clients.clients.ai-analysis-service.secret=${AI_ANALYSIS_SERVICE_CLIENT_SECRET:dev-only-secret-change-me}
service-clients.clients.ai-analysis-service.role=SERVICE

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8086/.well-known/jwks.json
          issuer-uri: https://auth-service
          audiences: ms-code-execution

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: problem-service
              uri: lb://PROBLEM-SERVICE
              predicates:
                - Path=/problems/**

            - id: submission-service
              uri: lb://SUBMISSION-SERVICE
              predicates:
                - Path=/submissions/**

            - id: execution-result-service
              uri: lb://EXECUTION-RESULT-SERVICE
              predicates:
                - Path=/api/results/**

            - id: solution-service
              uri: lb://SOLUTION-SERVICE
              predicates:
                - Path=/solutions/**

            - id: board-service
              uri: lb://PROBLEM-SERVICE
              predicates:
                - Path=/board/**

            - id: ai-analysis-service
              uri: lb://AI-ANALYSIS-SERVICE
              predicates:
                - Path=/ai/**






eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Kubernetes liveness/readiness probes (see SecurityConfig's permitAll on
# /actuator/health).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy.
spring.lifecycle.timeout-per-shutdown-phase: 20s
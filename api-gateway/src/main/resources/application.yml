server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8086/.well-known/jwks.json
          issuer-uri: https://auth-service
          audiences: ms-code-execution

  # Backs the RequestRateLimiter filters below (see RateLimiterConfig).
  # Password-only, no TLS - unlike Postgres/Kafka this holds nothing but
  # short-lived rate-limit counters, no business data or credentials, so the
  # extra cert/TLS-config surface wasn't judged worth it here.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev-only-secret-change-me}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: problem-service
              uri: lb://PROBLEM-SERVICE
              predicates:
                - Path=/problems/**

            - id: submission-service
              uri: lb://SUBMISSION-SERVICE
              predicates:
                - Path=/submissions/**
              filters:
                # Judging a submission is expensive (a Docker sandbox spin-up
                # per test case) - without this, one user could flood the
                # Kafka queue and starve every other user's workers. Keyed
                # per-user (see RateLimiterConfig.userKeyResolver), not
                # per-route globally, so one abusive account only throttles
                # itself.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            - id: execution-result-service
              uri: lb://EXECUTION-RESULT-SERVICE
              predicates:
                - Path=/api/results/**
              filters:
                # Looser than submission-service - this is a cheap DB read
                # the frontend polls periodically, not a judging trigger, but
                # still worth capping per-user against a runaway poll loop.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            - id: solution-service
              uri: lb://SOLUTION-SERVICE
              predicates:
                - Path=/solutions/**

            - id: board-service
              uri: lb://PROBLEM-SERVICE
              predicates:
                - Path=/board/**

            - id: ai-analysis-service
              uri: lb://AI-ANALYSIS-SERVICE
              predicates:
                - Path=/ai/**






eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Kubernetes liveness/readiness probes (see SecurityConfig's permitAll on
# /actuator/health).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy.
spring.lifecycle.timeout-per-shutdown-phase: 20s
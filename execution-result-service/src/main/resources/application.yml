server:
  port: 8085

spring:
  application:
    name: execution-result-service

  datasource:
    url: jdbc:postgresql://localhost:5432/execution_result_service
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8086/.well-known/jwks.json
          issuer-uri: https://auth-service
          audiences: ms-code-execution

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
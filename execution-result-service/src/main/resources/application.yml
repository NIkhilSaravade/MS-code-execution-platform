server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: execution-result-service

  # The running app connects with a DML-only role (no DDL rights, see
  # infra/postgres/init-multiple-databases.sh) - Flyway alone gets the owner
  # role, since it's the only thing here allowed to change schema.
  datasource:
    url: jdbc:postgresql://localhost:5432/execution_result_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
    username: execution_result_service_app
    password: execution-result-service-app-dev-secret

  flyway:
    url: jdbc:postgresql://localhost:5432/execution_result_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
    user: execution_result_service_owner
    password: execution-result-service-owner-dev-secret

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # SASL_SSL, principal "execution_result_service": Read on execution-result-topic
  # only (see infra/kafka/acls.sh)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    security:
      protocol: SASL_SSL
    properties:
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username="execution_result_service" password="${KAFKA_EXECUTION_RESULT_SERVICE_PASSWORD:execution-result-service-dev-secret}";
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION:/certs/ca.crt}
      trust-store-type: PEM

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8086/.well-known/jwks.json
          issuer-uri: https://auth-service
          audiences: ms-code-execution

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Kubernetes liveness/readiness probes (see SecurityConfig's permitAll on
# /actuator/health).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy. Spring Kafka's
# listener container stops as part of this too, so an in-flight consumer
# poll finishes before the context closes.
spring.lifecycle.timeout-per-shutdown-phase: 20s
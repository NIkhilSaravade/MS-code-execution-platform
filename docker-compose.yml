version: '3.8'

x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-eureka-resourceserver-env: &eureka-resourceserver-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8086/.well-known/jwks.json
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth-service
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: ms-code-execution

services:

  # ── Infra ────────────────────────────────────────────────────────────────

  postgres:
    # pgvector/pgvector's pgN images are a drop-in postgres:N build with the
    # pgvector extension already installed - needed for ai_analysis_db's
    # RAGService (see infra/postgres/init-multiple-databases.sh's
    # CREATE EXTENSION vector). Every other service's DB ignores the
    # extension entirely, so this is a safe swap for them too.
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Per-service DB role passwords - see infra/postgres/init-multiple-databases.sh.
      # "owner" = DDL rights on its own DB only (Flyway); "app" = DML only,
      # used by the running service. Rotate all of these before any real deployment.
      USER_SERVICE_DB_OWNER_PASSWORD: ${USER_SERVICE_DB_OWNER_PASSWORD:-user-service-owner-dev-secret}
      USER_SERVICE_DB_APP_PASSWORD: ${USER_SERVICE_DB_APP_PASSWORD:-user-service-app-dev-secret}
      AUTH_SERVICE_DB_OWNER_PASSWORD: ${AUTH_SERVICE_DB_OWNER_PASSWORD:-auth-service-owner-dev-secret}
      AUTH_SERVICE_DB_APP_PASSWORD: ${AUTH_SERVICE_DB_APP_PASSWORD:-auth-service-app-dev-secret}
      PROBLEM_SERVICE_DB_OWNER_PASSWORD: ${PROBLEM_SERVICE_DB_OWNER_PASSWORD:-problem-service-owner-dev-secret}
      PROBLEM_SERVICE_DB_APP_PASSWORD: ${PROBLEM_SERVICE_DB_APP_PASSWORD:-problem-service-app-dev-secret}
      SUBMISSION_SERVICE_DB_OWNER_PASSWORD: ${SUBMISSION_SERVICE_DB_OWNER_PASSWORD:-submission-service-owner-dev-secret}
      SUBMISSION_SERVICE_DB_APP_PASSWORD: ${SUBMISSION_SERVICE_DB_APP_PASSWORD:-submission-service-app-dev-secret}
      EXECUTION_RESULT_SERVICE_DB_OWNER_PASSWORD: ${EXECUTION_RESULT_SERVICE_DB_OWNER_PASSWORD:-execution-result-service-owner-dev-secret}
      EXECUTION_RESULT_SERVICE_DB_APP_PASSWORD: ${EXECUTION_RESULT_SERVICE_DB_APP_PASSWORD:-execution-result-service-app-dev-secret}
      AI_ANALYSIS_DB_OWNER_PASSWORD: ${AI_ANALYSIS_DB_OWNER_PASSWORD:-ai-analysis-owner-dev-secret}
      SOLUTION_SERVICE_DB_OWNER_PASSWORD: ${SOLUTION_SERVICE_DB_OWNER_PASSWORD:-solution-service-owner-dev-secret}
      SOLUTION_SERVICE_DB_APP_PASSWORD: ${SOLUTION_SERVICE_DB_APP_PASSWORD:-solution-service-app-dev-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh
      - ./infra/postgres/configure-ssl.sh:/docker-entrypoint-initdb.d/02-configure-ssl.sh
      - ./infra/postgres/certs/server.crt:/certs-src/server.crt:ro
      - ./infra/postgres/certs/server.key:/certs-src/server.key:ro
      - ./infra/postgres/certs/ca.crt:/certs-src/ca.crt:ro
      - ./infra/postgres/pg_hba.conf:/certs-src/pg_hba.conf:ro
    # TLS only - see infra/postgres/pg_hba.conf (hostssl-only, no plaintext
    # "host" entry at all) and configure-ssl.sh (installs the cert/key/pg_hba
    # into $PGDATA on first init, and appends ssl=on to postgresql.conf so it
    # only takes effect on the real server start, not the init-script
    # bootstrap server - see configure-ssl.sh for why).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/platform-test-cases;
      mc mb -p local/platform-artifacts;
      mc mb -p local/platform-solution-assets;
      exit 0;
      "

  # Backs api-gateway's per-user RequestRateLimiter (see RateLimiterConfig,
  # application.yml). No host port published - only api-gateway talks to it,
  # over the compose network. Password-only, no TLS: unlike Postgres/Kafka
  # this holds nothing but short-lived rate-limit counters.
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-only-secret-change-me}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-only-secret-change-me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure:5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    volumes:
      - ./infra/kafka/zookeeper_jaas.conf:/etc/kafka/zookeeper_jaas.conf:ro
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # SASL/DIGEST auth for Kafka's own connection to Zookeeper - see
      # infra/kafka/zookeeper_jaas.conf and the Client section comment in
      # infra/kafka/kafka_server_jaas.conf for why this exists (the Kafka
      # broker's SASL_SSL listener config requires a JVM-wide JAAS
      # login.config, which then also makes the Zookeeper client library
      # used internally by Kafka - and by the base image's own "cub
      # zk-ready" preflight check - assume SASL is required for the
      # Zookeeper connection too).
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/zookeeper_jaas.conf

  # SASL_SSL only - no plaintext listener at all, on purpose. A security
  # control with a plaintext bypass port isn't a security control.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    # The base image's own /etc/confluent/docker/configure script
    # unconditionally derives ssl.keystore.password from
    # KAFKA_SSL_KEYSTORE_CREDENTIALS whenever any *SSL://* listener is
    # present (no PEM-aware skip - see the comment on KAFKA_SSL_KEYSTORE_*
    # below), but Kafka itself rejects startup if a keystore password is
    # present at all alongside a PEM-format keystore, even an empty one.
    # There's no env var that avoids this, so run the normal
    # configure/ensure steps and then strip that one line out of the
    # generated properties file before handing off to the real launch
    # script, instead of reimplementing the whole entrypoint.
    command:
      - bash
      - -c
      - |
        /etc/confluent/docker/configure
        /etc/confluent/docker/ensure
        # ssl.keystore.password: rejected outright alongside a PEM keystore.
        # ssl.key.password: the broker's private key is a plain (unencrypted)
        # PKCS8 key - if this property is present at all (even empty),
        # Kafka's PEM loader assumes the key IS encrypted and tries to parse
        # it as one, which fails on a plain key.
        sed -i -e '/^ssl\.keystore\.password=/d' -e '/^ssl\.key\.password=/d' /etc/kafka/kafka.properties
        exec /etc/confluent/docker/launch
    volumes:
      # Confluent's docker entrypoint requires the FILENAME/CREDENTIALS trio
      # below (not just _LOCATION) whenever SSL is on, and looks for them
      # under /etc/kafka/secrets by convention.
      - ./infra/kafka/certs/broker-keystore.pem:/etc/kafka/secrets/broker-keystore.pem:ro
      - ./infra/kafka/certs/ca.crt:/etc/kafka/secrets/ca.crt:ro
      - ./infra/kafka/certs/key-creds:/etc/kafka/secrets/key-creds:ro
      - ./infra/kafka/certs/keystore-creds:/etc/kafka/secrets/keystore-creds:ro
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
      - ./infra/kafka/admin-client.properties:/certs/admin-client.properties:ro
      - ./infra/kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9093
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # Global JAAS login.config (not just a listener-scoped JAAS property)
      # is required here - Kafka's internal BrokerToControllerChannelManager
      # looks up a default (non-listener-scoped) 'KafkaServer' JAAS context
      # regardless of ZK mode, and fails startup outright without it. See
      # infra/kafka/kafka_server_jaas.conf and zookeeper's matching
      # infra/kafka/zookeeper_jaas.conf "Server" section for why the Client
      # section in this same file (for Kafka's own connection to Zookeeper)
      # has to actually succeed, not just be present/absent - the base
      # image's "cub zk-ready" preflight check hangs forever if a JAAS
      # login.config is set but the Zookeeper SASL handshake doesn't
      # actually complete.
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
      # PEM format keystores can only have a key password (ssl.key.password),
      # not a keystore password (ssl.keystore.password) - Kafka rejects
      # startup if both are set. The base image's "configure" script
      # unconditionally derives ssl.keystore.password from
      # KAFKA_SSL_KEYSTORE_CREDENTIALS whenever any *SSL://* listener is
      # present (no PEM-aware skip), and its "dub ensure" preflight requires
      # the var to exist - but an empty credentials file makes the derived
      # password an empty string, which the property generator then omits,
      # avoiding the conflict while still satisfying dub ensure.
      KAFKA_SSL_KEYSTORE_FILENAME: broker-keystore.pem
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-creds
      KAFKA_SSL_KEY_CREDENTIALS: key-creds
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      # FILENAME-based derivation to ssl.truststore.location only happens in
      # the base image's configure script when KAFKA_SSL_CLIENT_AUTH is
      # required/requested - ours is "none", so that block never runs and
      # ssl.truststore.location would otherwise never get set at all
      # (no trust anchors loaded -> PKIX path building failure). LOCATION
      # is handled by the generic property-mapping instead, unconditionally.
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/ca.crt
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9093", "--command-config", "/certs/admin-client.properties"]
      interval: 10s
      timeout: 10s
      retries: 20

  # One-shot: creates topics and grants least-privilege ACLs, then exits.
  # See infra/kafka/acls.sh for exactly who can do what.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    volumes:
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
      - ./infra/kafka/admin-client.properties:/certs/admin-client.properties:ro
      - ./infra/kafka/acls.sh:/acls.sh:ro
    entrypoint: ["/bin/bash", "/acls.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8090:8080"
    volumes:
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-dev-secret";
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
    depends_on:
      kafka:
        condition: service_healthy

  # ── Platform infra ───────────────────────────────────────────────────────

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/"]
      interval: 5s
      timeout: 5s
      retries: 15

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      <<: *eureka-env
      GITHUB_PASSWORD: ${GITHUB_PASSWORD:?set GITHUB_PASSWORD in .env - a GitHub PAT for the private config repo}
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: on-failure:3
    # Note: nothing else in this stack currently consumes config-service
    # (no service has spring-cloud-starter-config on its classpath yet) -
    # it's included for completeness but is inert until something does.

  # ── Application services ─────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8086:8086"
    volumes:
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: auth_service_app
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_DB_APP_PASSWORD:-auth-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/auth_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: auth_service_owner
      SPRING_FLYWAY_PASSWORD: ${AUTH_SERVICE_DB_OWNER_PASSWORD:-auth-service-owner-dev-secret}
      # grpc.client.user-service.address stays at its default (discovery:///USER-SERVICE)
      # from application.properties - it's already Eureka-based, no override needed here.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: on-failure:5

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
      - "9090:9090"
    volumes:
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-resourceserver-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: user_service_app
      SPRING_DATASOURCE_PASSWORD: ${USER_SERVICE_DB_APP_PASSWORD:-user-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/user_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: user_service_owner
      SPRING_FLYWAY_PASSWORD: ${USER_SERVICE_DB_OWNER_PASSWORD:-user-service-owner-dev-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: on-failure:5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *eureka-resourceserver-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-secret-change-me}
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure:5

  problem-service:
    build: ./problem-service
    container_name: problem-service
    ports:
      - "8082:8082"
    volumes:
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-resourceserver-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/problem_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: problem_service_app
      SPRING_DATASOURCE_PASSWORD: ${PROBLEM_SERVICE_DB_APP_PASSWORD:-problem-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/problem_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: problem_service_owner
      SPRING_FLYWAY_PASSWORD: ${PROBLEM_SERVICE_DB_OWNER_PASSWORD:-problem-service-owner-dev-secret}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: on-failure:5

  submission-service:
    build: ./submission-service
    container_name: submission-service
    ports:
      - "8083:8083"
    volumes:
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-resourceserver-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/submission_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: submission_service_app
      SPRING_DATASOURCE_PASSWORD: ${SUBMISSION_SERVICE_DB_APP_PASSWORD:-submission-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/submission_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: submission_service_owner
      SPRING_FLYWAY_PASSWORD: ${SUBMISSION_SERVICE_DB_OWNER_PASSWORD:-submission-service-owner-dev-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_SUBMISSION_SERVICE_PASSWORD: ${KAFKA_SUBMISSION_SERVICE_PASSWORD:-submission-service-dev-secret}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Fetches a problem's generated harness before judging (see
      # HarnessApplier) - same service-credential pattern worker-service-go
      # uses to call problem-service.
      AUTH_SERVICE_URL: http://auth-service:8086
      PROBLEM_SERVICE_URL: http://problem-service:8082
      SUBMISSION_SERVICE_CLIENT_ID: submission-service
      SUBMISSION_SERVICE_CLIENT_SECRET: ${SUBMISSION_SERVICE_CLIENT_SECRET:-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      auth-service:
        condition: service_started
      problem-service:
        condition: service_started
    restart: on-failure:5

  solution-service:
    build: ./solution-service
    container_name: solution-service
    ports:
      - "8087:8087"
    volumes:
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-resourceserver-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/solution_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: solution_service_app
      SPRING_DATASOURCE_PASSWORD: ${SOLUTION_SERVICE_DB_APP_PASSWORD:-solution-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/solution_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: solution_service_owner
      SPRING_FLYWAY_PASSWORD: ${SOLUTION_SERVICE_DB_OWNER_PASSWORD:-solution-service-owner-dev-secret}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure:5

  execution-result-service:
    build: ./execution-result-service
    container_name: execution-result-service
    ports:
      - "8085:8085"
    volumes:
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
    environment:
      <<: *eureka-resourceserver-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/execution_result_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_DATASOURCE_USERNAME: execution_result_service_app
      SPRING_DATASOURCE_PASSWORD: ${EXECUTION_RESULT_SERVICE_DB_APP_PASSWORD:-execution-result-service-app-dev-secret}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/execution_result_service?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      SPRING_FLYWAY_USER: execution_result_service_owner
      SPRING_FLYWAY_PASSWORD: ${EXECUTION_RESULT_SERVICE_DB_OWNER_PASSWORD:-execution-result-service-owner-dev-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_EXECUTION_RESULT_SERVICE_PASSWORD: ${KAFKA_EXECUTION_RESULT_SERVICE_PASSWORD:-execution-result-service-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    restart: on-failure:5

  worker-service-go:
    build: ./worker-service-go
    container_name: worker-service-go
    ports:
      # Kubernetes liveness/readiness probe target - see cmd/worker/main.go's
      # /healthz, /readyz. This worker has no other HTTP surface at all.
      # 8091, not 8090 - that's already kafka-ui's host port.
      - "8091:8091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
      # Shared with the sibling execution containers this service launches
      # via docker.sock - see the top-level worker-scratch volume comment.
      - worker-scratch:/scratch
    environment:
      KAFKA_BROKERS: kafka:9093
      KAFKA_TLS_CA_CERT_PATH: /certs/ca.crt
      KAFKA_SASL_USERNAME: worker
      KAFKA_SASL_PASSWORD: ${KAFKA_WORKER_PASSWORD:-worker-dev-secret}
      # No SUBMISSION_SERVICE_URL/PROBLEM_SERVICE_URL/AUTH_SERVICE_URL/
      # WORKER_CLIENT_ID/SECRET here anymore - this worker no longer calls
      # either service directly. submission-service embeds test cases/limits
      # into the Kafka event it consumes, and it reports results only to
      # execution-result-topic (execution-result-service is the single
      # ingestion point) - see the worker-overhead-at-scale redesign.
      KAFKA_TOPIC_EXECUTION_RESULT: execution-result-topic
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SANDBOX_RUNTIME: runc  # gVisor (runsc) isn't installed on the host by default; see README
      SCRATCH_CONTAINER_DIR: /scratch
      SCRATCH_VOLUME_NAME: worker-scratch
      # Registers with discovery-service (see internal/eureka) for dashboard
      # visibility only now - nothing left to resolve through it.
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_APP_NAME: WORKER-SERVICE-GO
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      submission-service:
        condition: service_started
    restart: on-failure:5

  ai-analysis-service:
    build: ./ai-analysis-service
    container_name: ai-analysis-service
    ports:
      - "8000:8000"
    volumes:
      - ./infra/postgres/certs/ca.crt:/certs/postgres-ca.crt:ro
      - ./infra/kafka/certs/ca.crt:/certs/ca.crt:ro
    environment:
      # No separate app role for this DB - see infra/postgres/init-multiple-databases.sh's note on why.
      DATABASE_URL: postgresql://ai_analysis_owner:${AI_ANALYSIS_DB_OWNER_PASSWORD:-ai-analysis-owner-dev-secret}@postgres:5432/ai_analysis_db?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt
      PORT: "8000"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      AUTH_SERVICE_JWKS_URL: http://auth-service:8086/.well-known/jwks.json
      JWT_ISSUER: https://auth-service
      JWT_AUDIENCE: ms-code-execution
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env - required by langchain-groq}
      # Consumes analysis.trigger.v1 (published by execution-result-service
      # once a result is persisted) to run the LLM analysis automatically -
      # see kafka/consumer.py. Authenticates to submission-service/
      # problem-service as itself via client-credentials (see
      # auth/token_client.py and auth-service's service-clients config).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TLS_CA_CERT_PATH: /certs/ca.crt
      KAFKA_SASL_USERNAME: ai_analysis_service
      KAFKA_AI_ANALYSIS_SERVICE_PASSWORD: ${KAFKA_AI_ANALYSIS_SERVICE_PASSWORD:-ai-analysis-service-dev-secret}
      KAFKA_TOPIC_ANALYSIS_TRIGGER: analysis.trigger.v1
      KAFKA_CONSUMER_GROUP_ID: ai-analysis-group
      AI_ANALYSIS_SERVICE_CLIENT_ID: ai-analysis-service
      AI_ANALYSIS_SERVICE_CLIENT_SECRET: ${AI_ANALYSIS_SERVICE_CLIENT_SECRET:-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    restart: on-failure:5

volumes:
  # Encryption at rest for this volume's underlying disk is a host/OS concern,
  # not something Docker Compose (or Postgres itself) provides - it depends on
  # whatever the Docker daemon's storage lives on being encrypted (e.g.
  # FileVault on macOS, LUKS on Linux, or the cloud provider's encrypted-disk
  # option in a real deployment). Nothing to configure here; verify at the
  # host level, not in this file.
  postgres-data:
  minio-data:
  # Shared between worker-service-go and the sibling execution containers it
  # launches via the mounted docker.sock (Docker-outside-of-Docker) - both
  # sides reference this volume BY NAME, so worker-service-go's own bind-mount
  # path doesn't need to match any host filesystem path. `name:` pins the
  # actual Docker volume name so it doesn't get project-prefixed, since the
  # sibling containers' --mount flag (built in sandbox.go) needs to know it
  # exactly, and it doubles as SCRATCH_VOLUME_NAME's default.
  worker-scratch:
    name: worker-scratch

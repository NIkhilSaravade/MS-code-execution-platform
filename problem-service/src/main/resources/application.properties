server.port=8082
spring.application.name=problem-service

# The running app connects with a DML-only role (no DDL rights, see
# infra/postgres/init-multiple-databases.sh) - Flyway alone gets the owner
# role, since it's the only thing here allowed to change schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/problem_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.datasource.username=problem_service_app
spring.datasource.password=problem-service-app-dev-secret

spring.flyway.url=jdbc:postgresql://localhost:5432/problem_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.flyway.user=problem_service_owner
spring.flyway.password=problem-service-owner-dev-secret
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resource server: verify tokens issued by auth-service (RS256, never trusts blindly)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-service
spring.security.oauth2.resourceserver.jwt.audiences=ms-code-execution

# S3-compatible storage for test-case content. Env var names match
# worker-service-go's config so both services point at the same bucket.
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-east-1}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket-test-cases=${S3_BUCKET_TEST_CASES:platform-test-cases}
s3.force-path-style=${S3_FORCE_PATH_STYLE:true}

# Kubernetes liveness/readiness probes (see SecurityConfig's permitAll on
# /actuator/health).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
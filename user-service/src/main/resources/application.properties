spring.application.name=user-service

server.port=8081


spring.datasource.url=jdbc:postgresql://localhost:5432/user_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.datasource.username=user_service_app
spring.datasource.password=user-service-app-dev-secret
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# The running app connects with a DML-only role (no DDL rights, see
# infra/postgres/init-multiple-databases.sh) - Flyway alone gets the owner
# role, since it's the only thing here allowed to change schema.
spring.flyway.url=jdbc:postgresql://localhost:5432/user_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.flyway.user=user_service_owner
spring.flyway.password=user-service-owner-dev-secret
spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

grpc.server.port=9090

# Resource server: verify tokens issued by auth-service (RS256, never trusts blindly)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-service
spring.security.oauth2.resourceserver.jwt.audiences=ms-code-execution

# Bootstrap ADMIN account (see AdminBootstrap) - only acts if no ADMIN exists yet.
# Override both in any environment that isn't local dev.
admin.seed.email=${ADMIN_EMAIL:admin@example.com}
admin.seed.password=${ADMIN_PASSWORD:change-me-admin-password}

# Kubernetes liveness/readiness probes (see SecurityConfig's permitAll on
# /actuator/health).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
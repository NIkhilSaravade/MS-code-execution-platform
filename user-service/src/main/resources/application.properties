spring.application.name=user-service

server.port=8081


spring.datasource.url=jdbc:postgresql://localhost:5432/user_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

grpc.server.port=9090

# Resource server: verify tokens issued by auth-service (RS256, never trusts blindly)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-service
spring.security.oauth2.resourceserver.jwt.audiences=ms-code-execution

# Bootstrap ADMIN account (see AdminBootstrap) - only acts if no ADMIN exists yet.
# Override both in any environment that isn't local dev.
admin.seed.email=${ADMIN_EMAIL:admin@example.com}
admin.seed.password=${ADMIN_PASSWORD:change-me-admin-password}
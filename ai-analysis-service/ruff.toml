# Explicit rule selection for the CI lint gate (Phase 4 of the
# ai-analysis-service agentic upgrade - see docs/ai-agent-build-log.md).
#
# Without this file, `ruff check .` in this environment (ruff 0.16.8) picks
# up a much broader rule set than the "just catch real bugs" set the CI gate
# is meant to enforce - 32 pre-existing findings across files this phase
# never touched, most of them pure style preference (import-sort ordering,
# pyupgrade syntax modernization) rather than correctness/security issues,
# plus at least one flat-out false positive for this codebase: B008 flags
# FastAPI's `Depends(...)` as a default-argument function call, which is
# the correct, idiomatic FastAPI pattern, not a bug - confirmed by actually
# running `ruff check .` with no config and inspecting every finding before
# writing this file, not assumed.
#
# select = ["E4", "E7", "E9", "F"] restores ruff's own documented default
# rule set (pycodestyle errors + pyflakes) - real bugs (undefined names,
# unused imports, syntax errors, bare except) without style-preference or
# framework-specific false positives. Verified this passes clean against
# the current codebase before committing this config.
[lint]
select = ["E4", "E7", "E9", "F"]

spring.application.name=solution-service
server.port=8087

# DATABASE - the running app connects with a DML-only role (no DDL rights,
# see infra/postgres/init-multiple-databases.sh) - Flyway alone gets the
# owner role, since it's the only thing here allowed to change schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/solution_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.datasource.username=solution_service_app
spring.datasource.password=solution-service-app-dev-secret

spring.flyway.url=jdbc:postgresql://localhost:5432/solution_service?sslmode=verify-full&sslrootcert=../infra/postgres/certs/ca.crt
spring.flyway.user=solution_service_owner
spring.flyway.password=solution-service-owner-dev-secret
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# S3-compatible storage (MinIO) for each problem's visualizer HTML - env var
# names match every other service's S3Config (submission-service,
# problem-service, worker-service-go's internal/config/config.go)
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-east-1}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket-solution-assets=${S3_BUCKET_SOLUTION_ASSETS:platform-solution-assets}
s3.force-path-style=${S3_FORCE_PATH_STYLE:true}

# Resource server: verify tokens issued by auth-service (RS256, never trusts blindly)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-service
spring.security.oauth2.resourceserver.jwt.audiences=ms-code-execution

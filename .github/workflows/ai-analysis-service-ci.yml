name: ai-analysis-service CI

# Phase 4 of the ai-analysis-service agentic upgrade (see
# docs/ai-agent-build-log.md): the previous CI
# (docker-build-push.yml) only builds and pushes an image - nothing
# actually gates a merge on tests passing, lint, security findings, or
# vulnerable dependencies. This workflow adds those as real, required
# checks for this service specifically (not the other 9 - a
# platform-wide rollout is a distinct, larger follow-up, not done here).
#
# Four independent jobs, all must pass:
#   test  - pytest (same suite this repo's build log documents running
#           locally throughout Phases 1-3)
#   lint  - ruff check (the same linter run_linter, services/tools.py,
#           uses as an agent tool - same scanner, two jobs, per the task
#           brief)
#   sast  - bandit -r (same scanner run_security_scan uses)
#   deps  - pip-audit against requirements.txt (known-CVE dependency scan)
#
# To make these actually block a merge, set them as required status
# checks in the repo's branch protection settings for `main` - a repo
# setting, not something a workflow YAML file can enforce on its own.

on:
  push:
    branches: [main]
    paths: ['ai-analysis-service/**', '.github/workflows/ai-analysis-service-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ai-analysis-service/**', '.github/workflows/ai-analysis-service-ci.yml']

defaults:
  run:
    working-directory: ai-analysis-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirnments.txt
      - run: python -m pytest tests/ -v -k "not live"
        # Excludes tests/test_prompt_injection_live.py and
        # tests/test_reranker.py's real-network calls from the required CI
        # gate (no GROQ_API_KEY / no guaranteed HF Hub access in CI by
        # default) - everything else, including the mocked equivalents of
        # those same behaviors, still runs and must pass.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r . -x ./venv,./tests -f json -o bandit-report.json
      - run: bandit -r . -x ./venv,./tests
        # Runs twice deliberately: the JSON report is kept as a build
        # artifact-equivalent (visible in logs) while the second, human-
        # readable invocation is what actually sets the job's exit code.

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirnments.txt

spring.application.name : config-service

eureka.client.service-url.defaultZone: http://localhost:8761/eureka/
  
server:
 port: 8888
 shutdown: graceful


spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/NIkhilSaravade/Centralized-configs-MSCEP
          username: NIkhilSaravade
          password: ${GITHUB_PASSWORD}
          default-label: main

# Kubernetes liveness/readiness probes. No security config in this service
# at all, so /actuator/health is already unauthenticated.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Graceful shutdown: finish in-flight requests before the JVM exits -
# Kubernetes sends SIGTERM on pod termination/rolling deploy.
spring.lifecycle.timeout-per-shutdown-phase: 20s

